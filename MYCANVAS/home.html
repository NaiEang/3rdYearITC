<html>
    <head>
        <title>My Canvas Page</title>
    </head>
    <body>
        <h1></h1>
        <canvas id="myCanvas" width="500" height="1000"></canvas>

        <script>
            const convas = document.getElementById('myCanvas');
            const ctx = convas.getContext('2d');
            
            // Draw a blue rectangle
            ctx.fillStyle = 'blue';
            ctx.fillRect(50, 50, 150, 100);
            
            ctx.fillStyle = 'red';
            ctx.fillRect(250, 50, 150, 100);

            for (x = 1; x<=5; x++){
                ctx.fillStyle = 'blue';
                ctx.fillRect(50, 50 + 150 * x, 150, 100);
            }


        </script>
    </body>
</html>
